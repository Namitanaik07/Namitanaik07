<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="60%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="dressGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#F8FAFC">
    <circle cx="90" cy="45" r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="90" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="150" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="60" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="250" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1100" cy="70" r="55" fill="url(#moonGlow)"/>
  <circle cx="1100" cy="70" r="30" fill="#E2E8F0"/>
  <circle cx="1112" cy="60" r="5" fill="#CBD5E1" opacity="0.6"/>
  <circle cx="1092" cy="80" r="3.5" fill="#CBD5E1" opacity="0.5"/>

  <!-- desk -->
  <rect x="0" y="360" width="1200" height="60" fill="#0F1F38"/>
  <rect x="0" y="358" width="1200" height="4" fill="#2563EB" opacity="0.5"/>

  <!-- ===== character (original design, own features) ===== -->
  <g transform="translate(120,120)">
    <!-- chair shadow -->
    <ellipse cx="140" cy="260" rx="150" ry="18" fill="#000000" opacity="0.25"/>

    <!-- torso / dress -->
    <path d="M60,150 Q140,130 220,150 L235,260 Q140,280 45,260 Z" fill="url(#dressGrad)"/>
    <path d="M75,150 Q140,168 205,150 L200,175 Q140,192 80,175 Z" fill="#38BDF8" opacity="0.5"/>

    <!-- arm resting on desk -->
    <path d="M60,175 Q20,190 15,230 Q40,245 70,235 Q65,205 80,180 Z" fill="url(#dressGrad)"/>
    <circle cx="30" cy="232" r="14" fill="#E7B999"/>

    <!-- other arm to keyboard -->
    <path d="M220,175 Q255,190 250,225 Q225,235 205,222 Q205,200 200,180 Z" fill="url(#dressGrad)"/>
    <circle cx="248" cy="222" r="12" fill="#E7B999"/>

    <!-- neck -->
    <rect x="120" y="95" width="40" height="35" rx="10" fill="#E7B999"/>

    <!-- hair back -->
    <path d="M60,10 Q140,-25 220,10 Q245,90 210,175 Q195,120 195,90 Q140,70 85,90 Q85,120 70,175 Q35,90 60,10 Z" fill="url(#hairGrad)"/>

    <!-- face -->
    <ellipse cx="140" cy="70" rx="52" ry="58" fill="#F0C29A"/>

    <!-- hair front / fringe -->
    <path d="M88,45 Q140,5 192,45 Q195,20 140,15 Q85,20 88,45 Z" fill="url(#hairGrad)"/>
    <path d="M88,48 Q100,20 118,42 Q108,25 88,48 Z" fill="url(#hairGrad)"/>
    <path d="M192,48 Q180,20 162,42 Q172,25 192,48 Z" fill="url(#hairGrad)"/>

    <!-- side locks -->
    <path d="M84,55 Q60,110 78,160 Q92,120 92,80 Z" fill="url(#hairGrad)"/>
    <path d="M196,55 Q220,110 202,160 Q188,120 188,80 Z" fill="url(#hairGrad)"/>

    <!-- ponytail -->
    <path d="M205,30 Q250,50 245,110 Q230,90 220,60 Z" fill="url(#hairGrad)">
      <animateTransform attributeName="transform" type="rotate" values="0 205 30; 6 205 30; 0 205 30" dur="2.6s" repeatCount="indefinite"/>
    </path>

    <!-- eyes (one closed/winking, friendly expression) -->
    <path d="M112,72 Q120,66 128,72" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="160" cy="70" rx="6" ry="7" fill="#0F172A"/>
    <circle cx="162" cy="67" r="1.8" fill="#F8FAFC"/>

    <!-- eyebrows -->
    <path d="M106,58 Q118,52 130,57" stroke="#0F172A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M152,57 Q162,51 174,58" stroke="#0F172A" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- nose + smile -->
    <path d="M140,78 Q143,84 139,87" stroke="#D9A876" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M120,96 Q140,110 160,96" stroke="#0F172A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M122,97 Q140,106 158,97" fill="#E8607A" opacity="0.5"/>

    <!-- blush -->
    <ellipse cx="105" cy="88" rx="8" ry="5" fill="#F4A582" opacity="0.5"/>
    <ellipse cx="175" cy="88" rx="8" ry="5" fill="#F4A582" opacity="0.5"/>

    <!-- earring -->
    <circle cx="90" cy="90" r="3" fill="#38BDF8"/>
  </g>

  <!-- laptop -->
  <g transform="translate(150,300)">
    <path d="M0,40 L220,40 L235,60 L-15,60 Z" fill="#1E293B"/>
    <rect x="10" y="-40" width="200" height="80" rx="4" fill="#0F172A"/>
    <rect x="18" y="-32" width="184" height="64" rx="2" fill="#112240"/>
    <rect x="18" y="-32" width="184" height="64" rx="2" fill="#2563EB" opacity="0.15">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="110" y="4" font-family="monospace" font-size="9" fill="#38BDF8" text-anchor="middle">&lt;/&gt; coding...</text>
  </g>

  <!-- mug -->
  <g transform="translate(430,318)">
    <path d="M0,10 h46 v26 a20,20 0 0 1 -20,20 h-6 a20,20 0 0 1 -20,-20 Z" fill="#F8FAFC" opacity="0.9"/>
    <path d="M46,20 q16,0 16,16 q0,16 -16,16" stroke="#F8FAFC" stroke-width="5" fill="none" opacity="0.9"/>
  </g>

  <!-- ===== glass hologram panel ===== -->
  <g transform="translate(600,55)">
    <rect x="0" y="0" width="520" height="300" rx="18" fill="url(#panelFill)" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="520" height="300" rx="18" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <text x="30" y="55" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#38BDF8">Hello! ✦</text>
    <text x="30" y="95" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">I'm Namita</text>

    <!-- loading bar -->
    <rect x="30" y="120" width="460" height="10" rx="5" fill="#112240"/>
    <rect x="30" y="120" width="0" height="10" rx="5" fill="#38BDF8">
      <animate attributeName="width" values="0;430;430" keyTimes="0;0.7;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="150" font-family="monospace" font-size="14" fill="#94A3B8">Loading...</text>

    <text x="30" y="185" font-family="monospace" font-size="15" fill="#60A5FA">&gt; Developer</text>
    <text x="30" y="210" font-family="monospace" font-size="15" fill="#60A5FA">&gt; Dreamer</text>
    <text x="30" y="235" font-family="monospace" font-size="15" fill="#60A5FA">&gt; Explorer</text>
    <text x="30" y="260" font-family="monospace" font-size="15" fill="#60A5FA">&gt; On a journey to build something amazing</text>

    <text x="30" y="288" font-family="'Segoe UI', sans-serif" font-size="13" font-style="italic" fill="#94A3B8">"Every line of code is a step further on the journey."</text>
  </g>
</svg>
